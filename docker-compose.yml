services:
  postgres:
    image: postgres:16-alpine
    container_name: fintech-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintech_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-fintech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech_secret_change_in_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintech_admin} -d ${POSTGRES_DB:-fintech_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fintech-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fintech-ledger-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fintech.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fintech-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  fintech-network:
    name: fintech-network
    driver: bridge
